<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>球衣商城 · HYPE KIT</title>
<link rel="stylesheet" href="css/style.css?v=20260828">
</head>
<body>
<div id="nav-slot"></div>

<!-- 品牌大图 Banner -->
<section class="mall-hero mh-jersey">
  <div class="mh-inner">
    <div class="mh-kicker">2026/27 · JERSEY COLLECTION</div>
    <h1 class="mh-title">球衣商城<br>为热爱而战</h1>
    <p class="mh-sub">主场荣耀、客场锋芒，经典竖条纹到黑金限定。DRI-FIT 速干科技，一件起做，穿上属于你的战袍走进球场。</p>
    <div class="mh-cta">
      <a class="btn" href="#grid">立即选购</a>
      <a class="btn ghost" href="customize.html">去定制专属号码 →</a>
    </div>
    <div class="mh-badge">
      <span>⚽ 球员/球迷版</span>
      <span>🧵 速干透气面料</span>
      <span>🎨 号码姓名可定制</span>
      <span>🚚 满 ¥499 包邮</span>
    </div>
  </div>
</section>

<section class="section" id="grid">
  <div class="container">
    <div class="mall-toolbar">
      <div class="mall-count">共 <b id="count">0</b> 款球衣</div>
      <div class="sortbar" id="sortbar">
        <button data-s="default" class="on">综合</button>
        <button data-s="asc">价格 ↑</button>
        <button data-s="desc">价格 ↓</button>
      </div>
    </div>
    <div class="prod-grid" id="grid-jersey"></div>
  </div>
</section>

<section class="section" style="padding-top:0">
  <div class="container">
    <div class="mall-feats">
      <div class="ft"><span class="ic">🧵</span><b>专业面料</b><span>DRI-FIT 速干排汗，轻量透气，久穿不闷。</span></div>
      <div class="ft"><span class="ic">🎨</span><b>自由定制</b><span>号码、姓名、胸前广告任意搭配，一件起做。</span></div>
      <div class="ft"><span class="ic">📦</span><b>顺丰配送</b><span>全场满 ¥499 包邮，5–7 个工作日发货。</span></div>
      <div class="ft"><span class="ic">🔄</span><b>无忧售后</b><span>质量问题免费退换，购物更安心。</span></div>
    </div>
  </div>
</section>

<div id="footer-slot"></div>

<script src="js/vendor/supabase.js"></script>
<script src="js/config.js?v=20260828"></script>
<script src="js/data.js?v=20260828"></script>
<script src="js/shared.js?v=20260828"></script>
<script>
(async function(){
  await loadSiteData();
  mountChrome("jerseys");

  const list = PRODUCTS.filter(p=>p.cat==="jersey");
  let sortMode = "default";

  function card(p){
    const media = productMedia(p);
    return `<div class="card" data-id="${p.id}">
      <div class="thumb">${p.tag?`<span class="tag">${p.tag}</span>`:""}${media}</div>
      <h4>${escapeHtml(p.name)}</h4><div class="desc">${escapeHtml(p.desc)}</div>
      <div class="price">¥${p.price}</div>
      <div style="display:flex;gap:8px;margin-top:10px">
        <button class="btn dark" style="flex:1;padding:10px;font-size:13px" data-add="${p.id}">加入购物袋</button>
        <a class="btn" style="flex:1;padding:10px;font-size:13px;justify-content:center;border:1px solid #e5e5e5" href="customize.html?id=${p.id}">定制</a>
      </div></div>`;
  }
  function render(){
    let arr = list.slice();
    if(sortMode==="asc")  arr.sort((a,b)=>a.price-b.price);
    if(sortMode==="desc") arr.sort((a,b)=>b.price-a.price);
    document.getElementById("grid-jersey").innerHTML = arr.map(card).join("");
    document.getElementById("count").textContent = arr.length;
  }
  render();

  document.getElementById("sortbar").addEventListener("click", e=>{
    const b = e.target.closest("[data-s]"); if(!b) return;
    sortMode = b.dataset.s;
    document.querySelectorAll("#sortbar button").forEach(x=>x.classList.remove("on"));
    b.classList.add("on"); render();
  });

  document.body.addEventListener("click", e=>{
    const b = e.target.closest("[data-add]"); if(!b) return;
    const p = PRODUCTS.find(x=>x.id===b.dataset.add);
    Cart.add({sku:p.id, title:p.name, price:p.price, size:"L", svg:jerseySVG(p.opts), meta:"标准版 · 尺码 L"});
    toast("已加入购物袋："+p.name);
  });
})();
</script>
</body>
</html>
