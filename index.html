<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HYPE KIT · 全球时尚牛仔穿搭</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="css/style.css?v=20260902">
</head>
<body>
<div id="nav-slot"></div>

<!-- Hero -->
<section class="hero">
  <div class="stripes"></div>
  <div class="container hero-content">
    <div class="kicker" id="hero-kicker"></div>
    <h1 id="hero-title"></h1>
    <p id="hero-subtitle"></p>
    <div style="display:flex;gap:14px;flex-wrap:wrap">
      <a class="btn" href="clothing.html">立即选购</a>
      <a class="btn ghost" href="footwear.html">逛鞋帽</a>
    </div>
  </div>
</section>

<!-- 分类 -->
<section class="section" id="club">
  <div class="container">
    <h2>热门品类</h2>
    <div class="cat-grid">
      <a class="cat-card" href="clothing.html?g=men">
        <div class="bg c-men"></div>
        <div class="lbl"><h3>男装</h3><span class="go">选购 →</span></div>
      </a>
      <a class="cat-card" href="clothing.html?g=women">
        <div class="bg c-women"></div>
        <div class="lbl"><h3>女装</h3><span class="go">选购 →</span></div>
      </a>
      <a class="cat-card" href="footwear.html">
        <div class="bg c-acc"></div>
        <div class="lbl"><h3>鞋帽配饰</h3><span class="go">选购 →</span></div>
      </a>
    </div>
  </div>
</section>

<!-- 定制引导 -->
<section class="section" style="background:#f5f5f5">
  <div class="container" style="display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center">
    <div id="promo-preview" style="background:#fff;border-radius:12px;padding:30px;display:flex;justify-content:center"></div>
    <div>
      <div class="kicker" id="promo-kicker" style="color:#757575;letter-spacing:2px;font-weight:600"></div>
      <h2 id="promo-title" style="margin:10px 0 16px"></h2>
      <p id="promo-text" style="color:#757575;font-size:16px;margin-bottom:24px"></p>
      <a class="btn dark" href="clothing.html">去逛服装 →</a>
    </div>
  </div>
</section>

<!-- 精选商品 -->
<section class="section">
  <div class="container">
    <h2>精选上新</h2>
    <div class="prod-grid" id="featured"></div>
  </div>
</section>

<div id="footer-slot"></div>

<script src="js/vendor/supabase.js"></script>
<script src="js/config.js?v=20260902"></script>
<script src="js/data.js?v=20260902"></script>
<script src="js/shared.js?v=20260902"></script>
<script src="js/chat.js?v=20260902"></script>
<script src="js/widget.js?v=20260902"></script>
<script>
(async function(){
  await loadSiteData();
  mountChrome("home");

  const heartSvg = `<svg viewBox="0 0 24 24"><path d="M12 20.5S3.5 15 3.5 8.9C3.5 6.1 5.7 4 8.3 4c1.7 0 3 .9 3.7 2 .7-1.1 2-2 3.7-2 2.6 0 4.8 2.1 4.8 4.9C20.5 15 12 20.5 12 20.5z"/></svg>`;
  const sizeOf = p => p.cat==="footwear" ? "均码" : "M";

  function paint(){
  // 文案（来自后台）
  document.getElementById("hero-kicker").innerHTML = SITE.hero_kicker;
  document.getElementById("hero-title").innerHTML = SITE.hero_title;
  document.getElementById("hero-subtitle").innerHTML = SITE.hero_subtitle;
  document.getElementById("promo-kicker").textContent = SITE.promo_kicker;
  document.getElementById("promo-title").textContent = SITE.promo_title;
  document.getElementById("promo-text").textContent = SITE.promo_text;

  document.getElementById("promo-preview").innerHTML =
    `<img src="https://images.unsplash.com/photo-1542272604-787c3835535d?auto=format&fit=crop&w=520&q=70"
       alt="牛仔穿搭" loading="lazy" decoding="async"
       onerror="this.onerror=null;this.src='https://picsum.photos/seed/denimpromo/520/650'"
       style="width:100%;border-radius:10px;object-fit:cover;aspect-ratio:4/5">`;

  const feat = PRODUCTS.slice(0,4);
  document.getElementById("featured").innerHTML = feat.map(p=>{
    const media = productMedia(p);
    return `<div class="card" data-id="${p.id}">
      <div class="thumb playable" data-media="${p.id}">${p.tag?`<span class="tag">${p.tag}</span>`:""}${promoBadge(p)}
        <button class="fav-btn ${Favs.has('product',p.id)?'on':''}" data-fav="${p.id}" title="收藏">${heartSvg}</button>
        <span class="play-hint"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span>
        ${media}</div>
      <h4>${escapeHtml(p.name)}</h4><div class="desc">${escapeHtml(p.desc)}</div>
      ${priceHTML(p)}
      <div class="card-cta">
        <button class="btn cart-add" data-add="${p.id}">加入购物袋</button>
        <button class="btn buy-now" data-buy="${p.id}">立即购买</button>
      </div>
    </div>`;
  }).join("");
  }
  paint();
  document.addEventListener("hk:data", paint);

  document.body.addEventListener("click", e=>{
    const fav = e.target.closest("[data-fav]");
    if(fav){
      const on = Favs.toggle("product", fav.dataset.fav);
      fav.classList.toggle("on", on);
      toast(on ? "已收藏" : "已取消收藏");
      return;
    }
    const b = e.target.closest("[data-add]");
    if(b){
      const p = PRODUCTS.find(x=>x.id===b.dataset.add); if(!p) return;
      Cart.add({sku:p.id, title:p.name, price:priceInfo(p).final, size:sizeOf(p), svg:productMedia(p), meta:p.desc});
      toast("已加入购物袋："+p.name);
      return;
    }
    const buy = e.target.closest("[data-buy]");
    if(buy){
      const bp = PRODUCTS.find(x=>x.id===buy.dataset.buy); if(!bp) return;
      BuyNow.go({sku:bp.id, title:bp.name, price:priceInfo(bp).final, qty:1, size:sizeOf(bp), svg:productMedia(bp), meta:bp.desc});
      return;
    }
    const media = e.target.closest("[data-media]");
    if(media){
      const mp = PRODUCTS.find(x=>x.id===media.dataset.media); if(!mp) return;
      openProductModal(mp);
    }
  });
})();
</script>
</body>
</html>
