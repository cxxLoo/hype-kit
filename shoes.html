<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>球鞋商城 · HYPE KIT</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="css/style.css?v=20260828">
</head>
<body>
<div id="nav-slot"></div>

<!-- 品牌大图 Banner -->
<section class="mall-hero mh-shoe">
  <div class="mh-inner">
    <div class="mh-kicker">PERFORMANCE · FOOTBALL BOOTS</div>
    <h1 class="mh-title">球鞋商城<br>速度即王道</h1>
    <p class="mh-sub">从轻量竞速到真皮质感，从暗夜黑金到荧光竞速。鞋身、鞋底、勾勾、鞋带四区自由配色，刻上你的名字，踏上属于你的赛场。</p>
    <div class="mh-cta">
      <a class="btn" href="#grid">立即选购</a>
      <a class="btn ghost" href="customize.html">去定制专属战靴 →</a>
    </div>
    <div class="mh-badge">
      <span>👟 轻量竞速鞋面</span>
      <span>⚡ 精准触球脚感</span>
      <span>🎨 四区自由配色</span>
      <span>🏆 刻名独一无二</span>
    </div>
  </div>
</section>

<section class="section" id="grid">
  <div class="container">
    <div class="mall-toolbar">
      <div class="mall-count">共 <b id="count">0</b> 款战靴</div>
      <div class="sortbar" id="sortbar">
        <button data-s="default" class="on">综合</button>
        <button data-s="asc">价格 ↑</button>
        <button data-s="desc">价格 ↓</button>
      </div>
    </div>
    <div class="prod-grid" id="grid-shoe"></div>
  </div>
</section>

<section class="section" style="padding-top:0">
  <div class="container">
    <div class="mall-feats">
      <div class="ft"><span class="ic">⚡</span><b>极致轻量</b><span>轻量鞋面减负增速，爆发加速更跟脚。</span></div>
      <div class="ft"><span class="ic">🎯</span><b>精准触球</b><span>贴合包裹，触球细腻，射门传球更从容。</span></div>
      <div class="ft"><span class="ic">🎨</span><b>四区配色</b><span>鞋身/鞋底/勾勾/鞋带自由配色并可刻名。</span></div>
      <div class="ft"><span class="ic">📦</span><b>顺丰配送</b><span>全场满 ¥499 包邮，5–7 个工作日发货。</span></div>
    </div>
  </div>
</section>

<div id="footer-slot"></div>

<script src="js/vendor/supabase.js"></script>
<script src="js/config.js?v=20260828"></script>
<script src="js/data.js?v=20260828"></script>
<script src="js/shared.js?v=20260828"></script>
<script>
(async function(){
  await loadSiteData();
  mountChrome("shoes");

  const list = PRODUCTS.filter(p=>p.cat==="shoe");
  let sortMode = "default";
  const heartSvg = `<svg viewBox="0 0 24 24"><path d="M12 20.5S3.5 15 3.5 8.9C3.5 6.1 5.7 4 8.3 4c1.7 0 3 .9 3.7 2 .7-1.1 2-2 3.7-2 2.6 0 4.8 2.1 4.8 4.9C20.5 15 12 20.5 12 20.5z"/></svg>`;

  function card(p){
    const media = productMedia(p);
    return `<div class="card" data-id="${p.id}">
      <div class="thumb">${p.tag?`<span class="tag">${p.tag}</span>`:""}
        <button class="fav-btn ${Favs.has('product',p.id)?'on':''}" data-fav="${p.id}" title="收藏">${heartSvg}</button>
        ${media}</div>
      <h4>${escapeHtml(p.name)}</h4><div class="desc">${escapeHtml(p.desc)}</div>
      <div class="price">¥${p.price}</div>
      <div style="display:flex;gap:8px;margin-top:10px">
        <button class="btn dark" style="flex:1;padding:10px;font-size:13px" data-add="${p.id}">加入购物袋</button>
        <a class="btn" style="flex:1;padding:10px;font-size:13px;justify-content:center;border:1px solid #e5e5e5" href="customize.html?id=${p.id}">定制</a>
      </div></div>`;
  }
  function render(){
    let arr = list.slice();
    if(sortMode==="asc")  arr.sort((a,b)=>a.price-b.price);
    if(sortMode==="desc") arr.sort((a,b)=>b.price-a.price);
    document.getElementById("grid-shoe").innerHTML = arr.map(card).join("");
    document.getElementById("count").textContent = arr.length;
  }
  render();

  document.getElementById("sortbar").addEventListener("click", e=>{
    const b = e.target.closest("[data-s]"); if(!b) return;
    sortMode = b.dataset.s;
    document.querySelectorAll("#sortbar button").forEach(x=>x.classList.remove("on"));
    b.classList.add("on"); render();
  });

  document.body.addEventListener("click", e=>{
    const fav = e.target.closest("[data-fav]");
    if(fav){
      const on = Favs.toggle("product", fav.dataset.fav);
      fav.classList.toggle("on", on);
      toast(on ? "已收藏" : "已取消收藏");
      return;
    }
    const b = e.target.closest("[data-add]"); if(!b) return;
    const p = PRODUCTS.find(x=>x.id===b.dataset.add);
    Cart.add({sku:p.id, title:p.name, price:p.price, size:"42", svg:shoeSVG(p.opts), meta:"标准配色 · 42码"});
    toast("已加入购物袋："+p.name);
  });
})();
</script>
</body>
</html>
