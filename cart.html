<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>购物袋 · HYPE KIT</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="css/style.css?v=20260901">
</head>
<body>
<div id="nav-slot"></div>

<section class="section">
  <div class="container">
    <h2 id="cart-title">我的购物袋</h2>
    <div id="cart-body"></div>
  </div>
</section>

<!-- 结算弹窗 -->
<div class="modal-mask" id="checkout-mask">
  <form class="modal-box" id="checkout-form">
    <h3>填写收货信息</h3>
    <div id="co-qty" class="co-qty" style="display:none"></div>
    <div id="co-saved" class="co-saved" style="display:none"></div>
    <div id="co-manual">
      <div class="mfield"><label>收货人 *</label><input id="co-name" maxlength="20" placeholder="请输入姓名"></div>
      <div class="mfield"><label>手机号 *</label><input id="co-phone" maxlength="20" placeholder="请输入手机号"></div>
      <div class="mfield"><label>收货地址 *</label><textarea id="co-address" maxlength="120" placeholder="省市区 + 详细地址"></textarea></div>
    </div>
    <div class="mfield"><label>备注（可选）</label><input id="co-remark" maxlength="60" placeholder="尺码/配送要求等"></div>
    <div class="co-summary" id="co-summary"></div>
    <div class="modal-actions">
      <button type="button" class="btn" style="border:1px solid #e5e5e5" id="co-cancel">取消</button>
      <button type="submit" class="btn dark" id="co-submit">提交订单</button>
    </div>
    <div class="co-err" id="co-err"></div>
  </form>
</div>

<div id="footer-slot"></div>

<script src="js/vendor/supabase.js"></script>
<script src="js/config.js?v=20260901"></script>
<script src="js/data.js?v=20260901"></script>
<script src="js/shared.js?v=20260901"></script>
<script>
(async function(){
loadContent();
await loadUserData();
mountChrome("");

const $ = (id)=>document.getElementById(id);
const shipOf = (total)=> (total>=499||total===0?0:20);

/* 立即购买模式：?buynow=1 且 sessionStorage 有直购商品 */
const isBuyNow = new URLSearchParams(location.search).get("buynow") === "1";
let buynow = isBuyNow ? BuyNow.get() : null;
if(buynow && !(buynow.qty>0)) buynow.qty = 1;

function orderItems(){ return buynow ? [buynow] : Cart.all(); }
function orderTotal(){ return orderItems().reduce((n,x)=>n + x.price*x.qty, 0); }

function renderBuyNow(){
  $("cart-title").textContent = "确认订单";
  const it = buynow;
  const total = it.price*it.qty, ship = shipOf(total);
  $("cart-body").innerHTML = `<div class="cart-wrap">
    <div>
      <div class="buynow-tip">⚡ 立即购买 · 此订单独立结算，不影响你的购物袋</div>
      <div class="cart-item">
        <div class="ci-thumb">${it.svg||""}</div>
        <div class="ci-info">
          <h4>${escapeHtml(it.title)}</h4>
          <div class="m">${escapeHtml(it.meta||"")}${it.size?(" · 尺码 "+escapeHtml(it.size)):""}</div>
          <div class="qty" id="bn-qty"><button data-op="-">−</button><span>${it.qty}</span><button data-op="+">+</button></div>
        </div>
        <div class="ci-right"><div style="font-weight:600">¥${it.price*it.qty}</div></div>
      </div>
    </div>
    <div class="summary">
      <h3>订单摘要</h3>
      <div class="sum-row"><span>商品小计</span><span>¥${total}</span></div>
      <div class="sum-row"><span>配送费</span><span>${ship?"¥"+ship:"免运费"}</span></div>
      <div class="sum-row total"><span>合计</span><span>¥${total+ship}</span></div>
      <button class="btn dark block" style="margin-top:18px" id="bn-checkout">提交订单</button>
      <a class="btn block" style="margin-top:10px;border:1px solid #e5e5e5" href="clothing.html">继续购物</a>
    </div></div>`;
  $("bn-qty").addEventListener("click", e=>{
    const op = e.target.dataset.op; if(!op) return;
    buynow.qty = Math.max(1, buynow.qty + (op==="+"?1:-1));
    BuyNow.set(buynow); renderBuyNow();
    if($("checkout-mask").classList.contains("show")) refreshSummary();
  });
  $("bn-checkout").addEventListener("click", openCheckout);
}

function render(){
  const list = Cart.all();
  const root = $("cart-body");
  if(!list.length){
    root.innerHTML = `<div class="empty"><h3>购物袋是空的</h3><p style="margin-bottom:22px">去挑一条心仪的牛仔裤,或搭配一件时尚单品。</p>
      <a class="btn dark" href="clothing.html">去逛逛</a></div>`;
    return;
  }
  const items = list.map(it=>`
    <div class="cart-item">
      <div class="ci-thumb">${it.svg||""}</div>
      <div class="ci-info">
        <h4>${escapeHtml(it.title)}</h4>
        <div class="m">${escapeHtml(it.meta||"")}</div>
        <div class="qty" data-id="${it.id}">
          <button data-op="-">−</button><span>${it.qty}</span><button data-op="+">+</button>
        </div>
      </div>
      <div class="ci-right">
        <div style="font-weight:600">¥${it.price*it.qty}</div>
        <div class="rm" data-rm="${it.id}">移除</div>
      </div>
    </div>`).join("");
  const total = Cart.total();
  const ship = shipOf(total);
  root.innerHTML = `<div class="cart-wrap">
    <div>${items}</div>
    <div class="summary">
      <h3>订单摘要</h3>
      <div class="sum-row"><span>商品小计</span><span>¥${total}</span></div>
      <div class="sum-row"><span>配送费</span><span>${ship?"¥"+ship:"免运费"}</span></div>
      <div class="sum-row total"><span>合计</span><span>¥${total+ship}</span></div>
      <button class="btn dark block" style="margin-top:18px" id="checkout">去结算</button>
      <a class="btn block" style="margin-top:10px;border:1px solid #e5e5e5" href="clothing.html">继续购物</a>
    </div></div>`;

  root.querySelectorAll(".qty").forEach(q=>{
    q.addEventListener("click",e=>{
      const op=e.target.dataset.op; if(!op)return;
      const it=Cart.all().find(x=>x.id===q.dataset.id);
      Cart.setQty(q.dataset.id, it.qty+(op==="+"?1:-1)); render();
    });
  });
  root.querySelectorAll("[data-rm]").forEach(b=>b.addEventListener("click",()=>{Cart.remove(b.dataset.rm);render();}));
  $("checkout").addEventListener("click", openCheckout);
}

/* ---------- 结算 ---------- */
let coAddrs = [];        // 已保存地址
let coSelected = null;   // 选中的地址 id；null = 使用新地址（手动输入）

async function loadCoAddrs(){
  const uid = window.currentUserId && window.currentUserId();
  if(!uid){ coAddrs = []; return; }
  try{
    const { data } = await sb.from("addresses").select("*").eq("user_id", uid)
      .order("is_default",{ascending:false}).order("created_at",{ascending:false});
    coAddrs = data || [];
  }catch(e){ coAddrs = []; }
}
function renderCoAddrs(){
  const box = $("co-saved"), manual = $("co-manual");
  if(!coAddrs.length){ box.style.display="none"; manual.style.display=""; coSelected=null; return; }
  box.style.display = "";
  const cards = coAddrs.map(a=>`
    <label class="co-addr ${coSelected===a.id?'on':''}">
      <input type="radio" name="co-addr" value="${a.id}" ${coSelected===a.id?'checked':''}>
      <div class="co-addr-b">
        <div class="co-addr-1"><b>${escapeHtml(a.recipient)}</b><span>${escapeHtml(a.phone)}</span>${a.is_default?'<em>默认</em>':''}</div>
        <div class="co-addr-2">${escapeHtml(a.address)}</div>
      </div>
    </label>`).join("");
  box.innerHTML = cards +
    `<label class="co-addr co-addr-new ${coSelected===null?'on':''}">
       <input type="radio" name="co-addr" value="" ${coSelected===null?'checked':''}>
       <div class="co-addr-b"><b>＋ 使用新地址</b><span class="co-addr-2">手动填写一个新的收货地址</span></div>
     </label>
     <a class="co-addr-manage" href="profile.html#addresses">管理收货地址 →</a>`;
  manual.style.display = coSelected===null ? "" : "none";
  box.querySelectorAll('input[name="co-addr"]').forEach(r=>r.addEventListener("change",()=>{
    coSelected = r.value || null;
    renderCoAddrs();
  }));
}
function refreshSummary(){
  const total = orderTotal(), ship = shipOf(total);
  $("co-summary").innerHTML =
    `<div class="sum-row"><span>商品小计</span><span>¥${total}</span></div>
     <div class="sum-row"><span>配送费</span><span>${ship?"¥"+ship:"免运费"}</span></div>
     <div class="sum-row total"><span>应付合计</span><span>¥${total+ship}</span></div>`;
}
/* 结算弹窗内的商品数量选择（仅立即购买模式显示） */
function renderCoQty(){
  const box = $("co-qty");
  if(!buynow){ box.style.display = "none"; box.innerHTML = ""; return; }
  box.style.display = "";
  box.innerHTML = `
    <div class="co-item">
      <div class="co-item-thumb">${buynow.svg||""}</div>
      <div class="co-item-info">
        <h4>${escapeHtml(buynow.title)}</h4>
        <div class="co-item-m">¥${buynow.price}${buynow.size?(" · 尺码 "+escapeHtml(buynow.size)):""}</div>
      </div>
      <div class="co-item-right">
        <div class="qty" id="co-qty-ctl"><button type="button" data-op="-">−</button><span>${buynow.qty}</span><button type="button" data-op="+">+</button></div>
        <div class="co-item-sub">¥${buynow.price*buynow.qty}</div>
      </div>
    </div>`;
  $("co-qty-ctl").addEventListener("click", e=>{
    const op = e.target.dataset.op; if(!op) return;
    buynow.qty = Math.max(1, buynow.qty + (op==="+"?1:-1));
    BuyNow.set(buynow);
    renderCoQty();     // 更新弹窗内数量与小计
    refreshSummary();  // 更新弹窗内应付合计
    renderBuyNow();    // 同步底层确认页
  });
}
async function openCheckout(){
  renderCoQty();
  refreshSummary();
  $("co-err").textContent = "";
  await loadCoAddrs();
  coSelected = coAddrs.length ? (coAddrs.find(a=>a.is_default)||coAddrs[0]).id : null;
  renderCoAddrs();
  $("checkout-mask").classList.add("show");
}
$("co-cancel").addEventListener("click", ()=> $("checkout-mask").classList.remove("show"));
$("checkout-mask").addEventListener("click", e=>{ if(e.target.id==="checkout-mask") $("checkout-mask").classList.remove("show"); });

$("checkout-form").addEventListener("submit", async (e)=>{
  e.preventDefault();
  const list = orderItems();
  if(!list.length){ $("checkout-mask").classList.remove("show"); return; }
  // 取收货信息：选中已存地址 或 手动输入
  let name, phone, address;
  if(coSelected){
    const a = coAddrs.find(x=>x.id===coSelected);
    if(!a){ $("co-err").textContent = "请选择收货地址"; return; }
    name=a.recipient; phone=a.phone; address=a.address;
  }else{
    name=$("co-name").value.trim(); phone=$("co-phone").value.trim(); address=$("co-address").value.trim();
    if(!name || !phone || !address){ $("co-err").textContent = "请填写完整收货信息"; return; }
  }
  const btn = $("co-submit"); btn.disabled = true; btn.textContent = "提交中…";
  $("co-err").textContent = "";
  try{
    const total = orderTotal(), ship = shipOf(total);
    const items = list.map(it=>({ title:it.title, price:it.price, qty:it.qty, size:it.size||"", meta:it.meta||"", svg:it.svg||"" }));
    const { data, error } = await sb.rpc("place_order", {
      p_name:name, p_phone:phone, p_address:address,
      p_remark:$("co-remark").value, p_items:items, p_total:total, p_ship_fee:ship
    });
    if(error) throw error;
    const row = Array.isArray(data) ? data[0] : data;
    MyOrders.add(row.token);      // 记住本机订单凭证
    if(buynow){ BuyNow.clear(); } // 立即购买：不动购物袋
    else{ Cart.save([]); }        // 普通结算：清空购物袋
    location.href = "orders.html?new=" + encodeURIComponent(row.order_no);
  }catch(err){
    $("co-err").textContent = "下单失败：" + (err.message || err);
    btn.disabled = false; btn.textContent = "提交订单";
  }
});

if(buynow){ renderBuyNow(); openCheckout(); }
else{ render(); }
})();
</script>
</body>
</html>
