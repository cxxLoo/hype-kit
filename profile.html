<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>个人中心 · HYPE KIT</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="css/style.css?v=20260901">
</head>
<body>
<div id="nav-slot"></div>

<section class="section">
  <div class="container">
    <h2>个人中心</h2>
    <div class="sub">管理你的头像、昵称与登录密码。</div>

    <div class="prof-wrap">
      <!-- 个人信息 -->
      <div class="prof-card">
        <h3>个人信息</h3>
        <div class="prof-ava-row">
          <span class="prof-ava" id="prof-ava"></span>
          <div>
            <label class="prof-upload">上传头像
              <input type="file" id="ava-file" accept="image/*" hidden>
            </label>
            <div class="prof-uphint">支持 JPG / PNG，建议正方形，≤ 2MB</div>
          </div>
        </div>
        <div class="prof-field">
          <label>昵称</label>
          <input id="p-name" maxlength="20" placeholder="你的昵称">
        </div>
        <div class="prof-field">
          <label>邮箱（不可修改）</label>
          <input id="p-email" disabled>
        </div>
        <button class="btn dark" id="p-save">保存资料</button>
        <div class="prof-msg" id="p-msg"></div>
      </div>

      <!-- 密码修改 -->
      <div class="prof-card" id="password">
        <h3>密码修改</h3>
        <div class="prof-field">
          <label>新密码</label>
          <input type="password" id="pw1" autocomplete="new-password" placeholder="至少 6 位">
        </div>
        <div class="prof-field">
          <label>确认新密码</label>
          <input type="password" id="pw2" autocomplete="new-password" placeholder="再次输入新密码">
        </div>
        <button class="btn dark" id="pw-save">修改密码</button>
        <div class="prof-msg" id="pw-msg"></div>
      </div>

      <!-- 收货地址 -->
      <div class="prof-card prof-addr" id="addresses">
        <div class="addr-head">
          <h3>收货地址</h3>
          <button class="btn dark sm" id="addr-add">＋ 新增地址</button>
        </div>
        <div class="addr-list" id="addr-list"><div class="addr-empty">加载中…</div></div>
      </div>
    </div>
  </div>
</section>

<!-- 地址编辑弹窗 -->
<div class="modal-mask" id="addr-mask">
  <form class="modal-box" id="addr-form">
    <h3 id="addr-title">新增收货地址</h3>
    <div class="mfield"><label>收货人 *</label><input id="ad-name" required maxlength="20" placeholder="请输入姓名"></div>
    <div class="mfield"><label>手机号 *</label><input id="ad-phone" required maxlength="20" placeholder="请输入手机号"></div>
    <div class="mfield"><label>收货地址 *</label><textarea id="ad-addr" required maxlength="120" placeholder="省市区 + 详细地址"></textarea></div>
    <label class="addr-defck"><input type="checkbox" id="ad-default"> 设为默认地址</label>
    <div class="modal-actions">
      <button type="button" class="btn" style="border:1px solid #e5e5e5" id="ad-cancel">取消</button>
      <button type="submit" class="btn dark" id="ad-submit">保存</button>
    </div>
    <div class="co-err" id="ad-err"></div>
  </form>
</div>

<div id="footer-slot"></div>

<script src="js/vendor/supabase.js"></script>
<script src="js/config.js?v=20260901"></script>
<script src="js/data.js?v=20260901"></script>
<script src="js/shared.js?v=20260901"></script>
<script>
(async function(){
  await loadContent();
  mountChrome();

  const $ = id=>document.getElementById(id);
  function colorFromName(n){
    const pool=["#b1131a","#0a2d5c","#e8467c","#c9a24a","#0a7a3f","#ff6a00","#1f6fe0","#7a3ff2"];
    let h=0; for(const c of String(n||"")) h=(h*31+c.charCodeAt(0))>>>0; return pool[h%pool.length];
  }
  function initial(n){ return (String(n||"U").trim()[0]||"U").toUpperCase(); }

  // 需登录
  const { data:{ session } } = await sb.auth.getSession();
  const user = session && session.user;
  if(!user){ location.replace("account.html?redirect=profile.html"); return; }

  let name = (user.user_metadata && user.user_metadata.display_name) || user.email.split("@")[0];
  let avatar = "";
  try{
    const { data } = await sb.from("profiles").select("display_name,avatar_url").eq("id", user.id).single();
    if(data){ name = data.display_name || name; avatar = data.avatar_url || ""; }
  }catch(e){}

  function paintAva(){
    const el = $("prof-ava");
    el.style.background = colorFromName(name);
    el.innerHTML = avatar ? `<img src="${escapeHtml(avatar)}" alt="">` : escapeHtml(initial(name));
  }
  $("p-name").value = name;
  $("p-email").value = user.email;
  paintAva();

  /* 头像上传 */
  $("ava-file").addEventListener("change", async e=>{
    const file = e.target.files[0]; if(!file) return;
    if(!/^image\//.test(file.type)){ msg("p-msg", "请选择图片文件", false); return; }
    if(file.size > 2*1024*1024){ msg("p-msg", "图片太大，请选择 2MB 以内的图片", false); return; }
    msg("p-msg", "头像上传中…", true);
    try{
      const ext = (file.name.split(".").pop()||"jpg").toLowerCase();
      const path = `avatars/${user.id}_${Date.now()}.${ext}`;
      const up = await sb.storage.from(window.SB_BUCKET).upload(path, file, { upsert:true, cacheControl:"3600" });
      if(up.error) throw up.error;
      const { data } = sb.storage.from(window.SB_BUCKET).getPublicUrl(path);
      avatar = data.publicUrl;
      const { error } = await sb.from("profiles").update({ avatar_url: avatar }).eq("id", user.id);
      if(error) throw error;
      paintAva();
      await refreshAccount();
      msg("p-msg", "头像已更新 ✅", true);
    }catch(err){ msg("p-msg", "上传失败：" + err.message, false); }
  });

  /* 保存昵称 */
  $("p-save").addEventListener("click", async ()=>{
    const v = $("p-name").value.trim();
    if(!v){ msg("p-msg", "昵称不能为空", false); return; }
    const btn = $("p-save"); btn.disabled = true; btn.textContent = "保存中…";
    try{
      const { error } = await sb.from("profiles").update({ display_name: v }).eq("id", user.id);
      if(error) throw error;
      await sb.auth.updateUser({ data:{ display_name: v } });
      name = v; paintAva();
      await refreshAccount();
      msg("p-msg", "资料已保存 ✅", true);
    }catch(err){ msg("p-msg", "保存失败：" + err.message, false); }
    btn.disabled = false; btn.textContent = "保存资料";
  });

  /* 修改密码 */
  $("pw-save").addEventListener("click", async ()=>{
    const a = $("pw1").value, b = $("pw2").value;
    if(a.length < 6){ msg("pw-msg", "新密码至少 6 位", false); return; }
    if(a !== b){ msg("pw-msg", "两次输入的密码不一致", false); return; }
    const btn = $("pw-save"); btn.disabled = true; btn.textContent = "修改中…";
    try{
      const { error } = await sb.auth.updateUser({ password: a });
      if(error) throw error;
      $("pw1").value = ""; $("pw2").value = "";
      msg("pw-msg", "密码修改成功 ✅", true);
    }catch(err){ msg("pw-msg", "修改失败：" + err.message, false); }
    btn.disabled = false; btn.textContent = "修改密码";
  });

  function msg(id, text, ok){
    const el = $(id); el.textContent = text; el.style.color = ok ? "#0f8a44" : "#f60c1a";
  }

  /* ================= 收货地址管理 ================= */
  let addrs = [];
  let editAddrId = null;

  async function loadAddrs(){
    const { data, error } = await sb.from("addresses").select("*")
      .eq("user_id", user.id).order("is_default",{ascending:false}).order("created_at",{ascending:false});
    if(error){ $("addr-list").innerHTML = `<div class="addr-empty">加载失败：${escapeHtml(error.message)}</div>`; return; }
    addrs = data || [];
    renderAddrs();
  }
  function renderAddrs(){
    if(!addrs.length){
      $("addr-list").innerHTML = `<div class="addr-empty">还没有收货地址，点右上角「新增地址」，结算时即可一键选择。</div>`;
      return;
    }
    $("addr-list").innerHTML = addrs.map(a=>`
      <div class="addr-item ${a.is_default?'is-default':''}">
        <div class="addr-main">
          <div class="addr-line1"><b>${escapeHtml(a.recipient)}</b><span>${escapeHtml(a.phone)}</span>${a.is_default?'<em class="addr-tag">默认</em>':''}</div>
          <div class="addr-line2">${escapeHtml(a.address)}</div>
        </div>
        <div class="addr-ops">
          ${a.is_default?'':`<button data-def="${a.id}">设为默认</button>`}
          <button data-edit="${a.id}">编辑</button>
          <button class="danger" data-del="${a.id}">删除</button>
        </div>
      </div>`).join("");
    $("addr-list").querySelectorAll("[data-edit]").forEach(b=>b.addEventListener("click",()=>openAddr(b.dataset.edit)));
    $("addr-list").querySelectorAll("[data-del]").forEach(b=>b.addEventListener("click",()=>delAddr(b.dataset.del)));
    $("addr-list").querySelectorAll("[data-def]").forEach(b=>b.addEventListener("click",()=>setDefault(b.dataset.def)));
  }
  function openAddr(id){
    editAddrId = id || null;
    const a = id ? addrs.find(x=>x.id===id) : null;
    $("addr-title").textContent = a ? "编辑收货地址" : "新增收货地址";
    $("ad-name").value = a ? a.recipient : "";
    $("ad-phone").value = a ? a.phone : "";
    $("ad-addr").value = a ? a.address : "";
    $("ad-default").checked = a ? a.is_default : (addrs.length===0);
    $("ad-err").textContent = "";
    $("addr-mask").classList.add("show");
  }
  function closeAddr(){ $("addr-mask").classList.remove("show"); }
  $("addr-add").addEventListener("click", ()=>openAddr(null));
  $("ad-cancel").addEventListener("click", closeAddr);
  $("addr-mask").addEventListener("click", e=>{ if(e.target.id==="addr-mask") closeAddr(); });

  $("addr-form").addEventListener("submit", async e=>{
    e.preventDefault();
    const recipient = $("ad-name").value.trim(), phone = $("ad-phone").value.trim(), address = $("ad-addr").value.trim();
    if(!recipient || !phone || !address){ $("ad-err").textContent = "请填写完整收货信息"; return; }
    const wantDefault = $("ad-default").checked;
    const btn = $("ad-submit"); btn.disabled = true; btn.textContent = "保存中…";
    try{
      let savedId = editAddrId;
      if(editAddrId){
        const { error } = await sb.from("addresses").update({ recipient, phone, address }).eq("id", editAddrId);
        if(error) throw error;
      }else{
        const { data, error } = await sb.from("addresses").insert({ user_id:user.id, recipient, phone, address, is_default:false }).select("id").single();
        if(error) throw error;
        savedId = data.id;
      }
      if(wantDefault && savedId) await applyDefault(savedId);
      closeAddr(); await loadAddrs();
    }catch(err){ $("ad-err").textContent = "保存失败：" + (err.message||err); }
    btn.disabled = false; btn.textContent = "保存";
  });

  async function applyDefault(id){
    await sb.from("addresses").update({ is_default:false }).eq("user_id", user.id).neq("id", id);
    await sb.from("addresses").update({ is_default:true }).eq("id", id);
  }
  async function setDefault(id){ await applyDefault(id); await loadAddrs(); }
  async function delAddr(id){
    if(!confirm("确定删除该收货地址？")) return;
    const { error } = await sb.from("addresses").delete().eq("id", id);
    if(error){ alert("删除失败：" + error.message); return; }
    loadAddrs();
  }

  loadAddrs();
  if(location.hash === "#addresses"){ document.getElementById("addresses").scrollIntoView({behavior:"smooth"}); }
})();
</script>
</body>
</html>
