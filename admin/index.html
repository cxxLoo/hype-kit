<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>管理后台 · HYPE KIT</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="layout">

  <!-- 侧边栏 -->
  <aside class="sidebar">
    <div class="side-logo">
      <div class="mark">
        <svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg"><path d="M40 150 C60 60 200 -10 620 20 C300 60 180 120 120 150 C90 165 55 165 40 150 Z" fill="#fff"/></svg>
      </div>
      <div class="txt"><b>HYPE KIT</b><span>管理后台</span></div>
    </div>
    <nav class="side-nav">
      <div class="navlbl">内容管理</div>
      <div class="tab on" data-tab="products" data-crumb="商品管理">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.4 7.5 12 12l-8.4-4.5M12 12v9"/><path d="M12 3 3.6 7.5v9L12 21l8.4-4.5v-9L12 3z"/></svg>
        <span>商品管理</span>
      </div>
      <div class="tab" data-tab="content" data-crumb="文案管理">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        <span>文案管理</span>
      </div>
    </nav>
    <div class="side-foot">
      <a class="btn ghost sm block" href="../index.html" target="_blank">查看网站 ↗</a>
    </div>
  </aside>

  <!-- 主区域 -->
  <div class="main">
    <header class="topbar">
      <div class="crumb" id="crumb">商品管理</div>
      <div class="user">
        <div class="who"><span class="avatar" id="avatar">A</span><span id="who"></span></div>
        <button class="btn sm" id="logout">退出登录</button>
      </div>
    </header>

    <div class="content">

      <!-- 商品管理 -->
      <section id="tab-products">
        <div class="stats">
          <div class="stat-card">
            <div class="ic g"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.4 7.5 12 12l-8.4-4.5M12 12v9"/><path d="M12 3 3.6 7.5v9L12 21l8.4-4.5v-9L12 3z"/></svg></div>
            <div><div class="lbl">商品总数</div><div class="num" id="stat-total">–</div></div>
          </div>
          <div class="stat-card">
            <div class="ic b"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
            <div><div class="lbl">球衣数量</div><div class="num" id="stat-jersey">–</div></div>
          </div>
          <div class="stat-card">
            <div class="ic a"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 16h20M4 16l2-8h9l5 5v3"/></svg></div>
            <div><div class="lbl">球鞋数量</div><div class="num" id="stat-shoe">–</div></div>
          </div>
        </div>

        <div class="panel">
          <div class="bar">
            <h2>商品列表</h2>
            <button class="btn brand" id="add-product">+ 新增商品</button>
          </div>
          <div id="product-list"><div class="loading">加载中…</div></div>
        </div>
      </section>

      <!-- 文案管理 -->
      <section id="tab-content" style="display:none">
        <div class="panel">
          <div class="bar">
            <h2>网站文案</h2>
            <button class="btn brand" id="save-content">保存文案</button>
          </div>
          <div id="content-fields"><div class="loading">加载中…</div></div>
        </div>
      </section>

    </div>
  </div>
</div>

<!-- 商品编辑弹窗 -->
<div class="mask" id="mask">
  <div class="modal">
    <h3 id="modal-title">编辑商品</h3>
    <div class="modal-preview" id="preview"></div>

    <div class="section-sub">基本信息</div>
    <div class="grid2">
      <div class="fld">
        <label>商品 ID（唯一，英文/数字）</label>
        <input id="f-id" placeholder="如 j7 / s5">
      </div>
      <div class="fld">
        <label>分类</label>
        <select id="f-cat">
          <option value="jersey">球衣 jersey</option>
          <option value="shoe">球鞋 shoe</option>
        </select>
      </div>
    </div>

    <div class="fld"><label>名称</label><input id="f-name"></div>
    <div class="fld"><label>描述</label><input id="f-desc"></div>
    <div class="grid2">
      <div class="fld"><label>价格（¥）</label><input id="f-price" type="number"></div>
      <div class="fld"><label>标签（可空，如 新品/限量）</label><input id="f-tag"></div>
    </div>
    <div class="fld"><label>排序（数字越小越靠前）</label><input id="f-sort" type="number" value="100"></div>

    <!-- 球衣配色 -->
    <div id="opts-jersey">
      <div class="section-sub">球衣配色</div>
      <div class="grid2">
        <div class="fld"><label>版式</label>
          <select id="j-style"><option value="stripe">竖条纹</option><option value="sash">斜纹</option><option value="solid">纯色</option></select>
        </div>
        <div class="fld"><label>号码</label><input id="j-number" maxlength="2"></div>
      </div>
      <div class="grid2">
        <div class="fld"><label>主色</label><input id="j-primary" type="color"></div>
        <div class="fld"><label>副色 / 条纹色</label><input id="j-secondary" type="color"></div>
      </div>
      <div class="grid2">
        <div class="fld"><label>文字颜色</label><input id="j-textColor" type="color"></div>
        <div class="fld"><label>球员姓名</label><input id="j-pname" maxlength="12"></div>
      </div>
      <div class="fld"><label>胸前广告文字</label><input id="j-sponsor" maxlength="10"></div>
    </div>

    <!-- 球鞋配色 -->
    <div id="opts-shoe" style="display:none">
      <div class="section-sub">球鞋配色</div>
      <div class="grid2">
        <div class="fld"><label>鞋身颜色</label><input id="s-body" type="color"></div>
        <div class="fld"><label>鞋底颜色</label><input id="s-sole" type="color"></div>
      </div>
      <div class="grid2">
        <div class="fld"><label>勾勾 / Logo 颜色</label><input id="s-swoosh" type="color"></div>
        <div class="fld"><label>鞋带颜色</label><input id="s-lace" type="color"></div>
      </div>
      <div class="fld"><label>鞋侧刻字</label><input id="s-name" maxlength="10"></div>
    </div>

    <div class="section-sub">商品图片</div>
    <div class="fld">
      <label>真实商品图片（可选，上传后将覆盖上方 SVG 展示）</label>
      <input id="f-image" type="file" accept="image/*">
      <div class="hint" id="image-hint">留空则前端展示由配色生成的 SVG 图。</div>
    </div>

    <div class="modal-actions">
      <button class="btn ghost" id="modal-cancel">取消</button>
      <button class="btn brand" id="modal-save">保存</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/data.js"></script>
<script src="../js/shared.js"></script>
<script src="admin.js"></script>
</body>
</html>
