<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>专属定制 · HYPE KIT</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="css/style.css?v=20260901">
</head>
<body>
<div id="nav-slot"></div>

<section class="section">
  <div class="container">
    <div class="tabs" style="max-width:640px">
      <div class="tab on" data-mode="outfit">定制服装</div>
      <div class="tab" data-mode="acc">定制饰品</div>
      <div class="tab" data-mode="tryon">AI 试穿</div>
    </div>

    <div class="customizer" id="design-area">
      <div class="stage"><div id="preview" style="width:100%;display:flex;justify-content:center"></div></div>

      <div class="panel">
        <h1 id="p-title">专属牛仔穿搭定制</h1>
        <div class="p-price" id="p-price">¥599</div>
        <div class="p-note">一件起做 · 预计 5-7 个工作日发货</div>

        <!-- 服装（牛仔穿搭）面板 -->
        <div id="panel-outfit">
          <div class="field">
            <label>版型</label>
            <div class="sizes" id="o-fit">
              <div class="size on" data-v="straight">直筒</div>
              <div class="size" data-v="wide">阔腿</div>
              <div class="size" data-v="tapered">锥形</div>
              <div class="size" data-v="flare">微喇</div>
            </div>
          </div>
          <div class="field">
            <label>牛仔水洗色</label>
            <div class="swatches" data-target="wash"></div>
          </div>
          <div class="field">
            <label>上衣颜色</label>
            <div class="swatches" data-target="top"></div>
          </div>
          <div class="field">
            <label>做旧工艺</label>
            <div class="sizes" id="o-distress">
              <div class="size on" data-v="none">原色</div>
              <div class="size" data-v="whisker">猫须</div>
              <div class="size" data-v="ripped">破洞</div>
            </div>
          </div>
          <div class="field"><label>口袋绣字（可选）</label>
            <input class="txt-input" id="o-text" maxlength="10" value="DENIM">
            <div class="hint">留空则不绣字。</div>
          </div>
          <div class="field"><label>尺码</label>
            <div class="sizes" id="o-size">
              <div class="size" data-v="S">S</div><div class="size on" data-v="M">M</div>
              <div class="size" data-v="L">L</div><div class="size" data-v="XL">XL</div>
              <div class="size" data-v="XXL">XXL</div>
            </div>
          </div>
        </div>

        <!-- 饰品（帽子）面板 -->
        <div id="panel-acc" style="display:none">
          <div class="field">
            <label>帽型</label>
            <div class="sizes" id="a-type">
              <div class="size on" data-v="cap">棒球帽</div>
              <div class="size" data-v="bucket">渔夫帽</div>
              <div class="size" data-v="fedora">毡帽</div>
              <div class="size" data-v="beanie">冷帽</div>
            </div>
          </div>
          <div class="field"><label>主色</label><div class="swatches" data-target="color"></div></div>
          <div class="field"><label>滚边 / 配色</label><div class="swatches" data-target="accent"></div></div>
          <div class="field"><label>刺绣文字（可选）</label>
            <input class="txt-input" id="a-text" maxlength="8" value="HYPE"></div>
          <div class="field"><label>尺码</label>
            <div class="sizes" id="a-size">
              <div class="size on" data-v="均码">均码</div>
              <div class="size" data-v="S">S</div><div class="size" data-v="M">M</div><div class="size" data-v="L">L</div>
            </div>
          </div>
        </div>

        <div style="display:flex;gap:12px;margin-top:12px;flex-wrap:wrap">
          <button class="btn dark block" id="add-cart">加入购物袋</button>
          <button class="btn buy-now block" id="buy-now">立即购买</button>
          <button class="btn" style="border:1px solid #e5e5e5" id="rand">随机配色</button>
        </div>
      </div>
    </div>

    <!-- ============ AI 试穿 ============ -->
    <div id="tryon" style="display:none">
      <div class="ty-grid">
        <!-- 左：试衣台 -->
        <div>
          <div class="ty-stage" id="ty-stage">
            <div class="ty-empty" id="ty-empty">
              <div class="ty-empty-ic">📸</div>
              <p>上传一张清晰的全身照，即可试穿商城的时尚单品</p>
              <label class="btn dark" style="cursor:pointer">上传照片
                <input type="file" id="ty-file" accept="image/*" hidden>
              </label>
              <div class="ty-privacy">照片仅在你的浏览器本地处理，不会上传服务器。</div>
            </div>
            <img id="ty-photo" alt="试穿底图" style="display:none">
            <div id="ty-overlay" class="ty-overlay" style="display:none"></div>
          </div>
          <div class="ty-tools" id="ty-tools" style="display:none">
            <label>大小 <input type="range" id="ty-scale" min="20" max="160" value="72"></label>
            <button class="btn sm outline" id="ty-reset">重置位置</button>
            <button class="btn sm outline" id="ty-change">换照片</button>
            <button class="btn sm" id="ty-ai-gen">✨ 真实感 AI 试穿</button>
            <button class="btn dark sm" id="ty-save">保存合成图</button>
          </div>
          <div class="ty-hint">提示：拖动商品可移动位置，用滑块调整大小。「真实感 AI 试穿」为生成式效果，接入后自动启用。</div>
        </div>

        <!-- 右：选择 + AI 穿搭 -->
        <div class="ty-side">
          <h3 class="ty-h">① 选择要试穿的单品</h3>
          <div class="ty-picker" id="ty-picker"><div class="ty-empty2">加载中…</div></div>

          <div class="ty-ai">
            <div class="ty-ai-head">
              <h3 class="ty-h" style="margin:0">② AI 智能穿搭</h3>
              <button class="btn sm" id="ty-recommend">✨ 换一批</button>
            </div>
            <p class="ty-ai-desc">根据风格为你搭配「牛仔裤 + 鞋帽」整套造型，点搭配即可一键试穿。</p>
            <div id="ty-outfits" class="ty-outfits"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<div id="footer-slot"></div>

<script src="js/vendor/supabase.js"></script>
<script src="js/config.js?v=20260901"></script>
<script src="js/data.js?v=20260901"></script>
<script src="js/shared.js?v=20260901"></script>
<script>
(async function(){
await loadSiteData();
if(!guardModule("custom")) return;
mountChrome("custom");

// 时尚色板：牛仔水洗色 / 中性上衣色 / 帽饰配色
const PALETTE = ["#31538a","#4a6fa5","#22324f","#0f1420","#111827","#7d94b5","#efe9e0","#f2f2f2","#d9c7a3","#8a5a3b","#0f5b5b","#c9a24a","#b1131a","#e8467c"];
let mode = "outfit";
let O = {fit:"straight", wash:"#31538a", top:"#efe9e0", distress:"none", text:"DENIM", size:"M"};
let A = {type:"cap", color:"#1f3a63", accent:"#e6b25e", text:"HYPE", size:"均码"};
const PRICE = {outfit:599, acc:199};
const FIT_NAME  = {straight:"直筒", wide:"阔腿", tapered:"锥形", flare:"微喇"};
const DIS_NAME  = {none:"原色", whisker:"猫须", ripped:"破洞"};
const HAT_NAME  = {cap:"棒球帽", bucket:"渔夫帽", fedora:"毡帽", beanie:"冷帽"};

// 预填色板
function paintSwatches(){
  document.querySelectorAll(".swatches").forEach(box=>{
    const tgt = box.dataset.target;
    const cur = (mode==="outfit"?O:A)[tgt];
    box.innerHTML = PALETTE.map(c=>`<span class="sw ${c===cur?"on":""}" data-c="${c}" style="background:${c}"></span>`).join("");
  });
}

function render(){
  document.getElementById("preview").innerHTML = mode==="outfit"?denimSVG(O):accessorySVG(A);
  document.getElementById("p-title").textContent = mode==="outfit"?"专属牛仔穿搭定制":"专属帽饰定制";
  document.getElementById("p-price").textContent = "¥"+(mode==="outfit"?PRICE.outfit:PRICE.acc);
}

// 版型/尺码/工艺点选
function bindSizeGroup(id, key, obj){
  document.getElementById(id)?.addEventListener("click",e=>{
    const el=e.target.closest(".size"); if(!el)return;
    el.parentElement.querySelectorAll(".size").forEach(x=>x.classList.remove("on"));
    el.classList.add("on"); obj[key]=el.dataset.v; render();
  });
}
bindSizeGroup("o-fit","fit",O);
bindSizeGroup("o-distress","distress",O);
bindSizeGroup("o-size","size",O);
bindSizeGroup("a-type","type",A);
bindSizeGroup("a-size","size",A);

// 色板点选
document.body.addEventListener("click",e=>{
  const sw=e.target.closest(".sw"); if(!sw)return;
  const tgt=sw.closest(".swatches").dataset.target;
  (mode==="outfit"?O:A)[tgt]=sw.dataset.c;
  sw.parentElement.querySelectorAll(".sw").forEach(x=>x.classList.remove("on"));
  sw.classList.add("on"); render();
});

// 文本输入
const bindText=(id,key,obj)=>document.getElementById(id)?.addEventListener("input",e=>{obj[key]=e.target.value;render();});
bindText("o-text","text",O);
bindText("a-text","text",A);

// 切换 服装/饰品/AI试穿
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));
  t.classList.add("on"); mode=t.dataset.mode;
  const design = mode==="outfit" || mode==="acc";
  document.getElementById("design-area").style.display = design ? "" : "none";
  document.getElementById("tryon").style.display = mode==="tryon" ? "" : "none";
  if(design){
    document.getElementById("panel-outfit").style.display = mode==="outfit"?"":"none";
    document.getElementById("panel-acc").style.display = mode==="acc"?"":"none";
    paintSwatches(); render();
  }else{
    tyInit();
  }
}));

// 随机配色
document.getElementById("rand").addEventListener("click",()=>{
  const rc=()=>PALETTE[Math.floor(Math.random()*PALETTE.length)];
  if(mode==="outfit"){
    O.wash=rc(); O.top=rc();
    const fits=Object.keys(FIT_NAME); O.fit=fits[Math.floor(Math.random()*fits.length)];
    document.querySelectorAll("#o-fit .size").forEach(x=>x.classList.toggle("on",x.dataset.v===O.fit));
  }else{
    A.color=rc(); A.accent=rc();
    const hats=Object.keys(HAT_NAME); A.type=hats[Math.floor(Math.random()*hats.length)];
    document.querySelectorAll("#a-type .size").forEach(x=>x.classList.toggle("on",x.dataset.v===A.type));
  }
  paintSwatches(); render();
});

// 加入购物袋 / 立即购买
function buildCustomItem(){
  if(mode==="outfit"){
    return {sku:"custom-outfit", title:"定制牛仔穿搭 · "+FIT_NAME[O.fit],
      price:PRICE.outfit, size:O.size, svg:denimSVG(O),
      meta:`${FIT_NAME[O.fit]} · ${DIS_NAME[O.distress]} · 尺码 ${O.size}`};
  }
  return {sku:"custom-acc", title:"定制饰品 · "+HAT_NAME[A.type],
    price:PRICE.acc, size:A.size, svg:accessorySVG(A),
    meta:`${HAT_NAME[A.type]} · ${A.size}`};
}
document.getElementById("add-cart").addEventListener("click",()=>{
  Cart.add(buildCustomItem());
  toast("定制款已加入购物袋!");
});
document.getElementById("buy-now").addEventListener("click",()=>{
  const it = buildCustomItem(); it.qty = 1;
  BuyNow.go(it);
});

/* ================= AI 试穿 ================= */
const AI_TRYON_ENDPOINT = window.AI_TRYON_ENDPOINT || ""; // 预留：填 Edge Function URL 即启用生成式AI
const tyStage   = document.getElementById("ty-stage");
const tyPhoto   = document.getElementById("ty-photo");
const tyOverlay = document.getElementById("ty-overlay");
const tyEmpty   = document.getElementById("ty-empty");
const tyTools   = document.getElementById("ty-tools");
const tyFile    = document.getElementById("ty-file");
let tyCurrent = null;                      // 当前试穿商品
let tyPos = { x:0.5, y:0.52, scale:0.72 }; // 相对比例
let tyReady = false;

// 可试穿的单品：服装 + 鞋帽
const TY_ITEMS = () => PRODUCTS.filter(p=>p.cat==="clothing" || p.cat==="footwear");

function tyInit(){
  if(tyReady) return;
  tyReady = true;
  tyBuildPicker();
  renderOutfits();
}

/* 单品选择列表 */
function tyBuildPicker(){
  const box = document.getElementById("ty-picker");
  const items = TY_ITEMS();
  if(!items.length){ box.innerHTML = `<div class="ty-empty2">暂无商品。</div>`; return; }
  box.innerHTML = items.map(p=>`
    <button type="button" class="ty-card" data-tid="${p.id}">
      <div class="ty-thumb">${productMedia(p)}</div>
      <div class="ty-nm">${escapeHtml(p.name)}</div>
    </button>`).join("");
  box.querySelectorAll("[data-tid]").forEach(b=>b.addEventListener("click",()=>{
    const p = PRODUCTS.find(x=>x.id===b.dataset.tid); if(!p) return;
    box.querySelectorAll(".ty-card").forEach(x=>x.classList.remove("on"));
    b.classList.add("on");
    tySetProduct(p);
  }));
}

/* 上传照片 */
function tyLoadFile(file){
  if(!file) return;
  if(!/^image\//.test(file.type)){ toast("请选择图片文件～"); return; }
  const rd = new FileReader();
  rd.onload = e=>{
    tyPhoto.src = e.target.result;
    tyPhoto.style.display = "";
    tyEmpty.style.display = "none";
    tyTools.style.display = "";
  };
  rd.readAsDataURL(file);
}
tyFile.addEventListener("change", e=>tyLoadFile(e.target.files[0]));
document.getElementById("ty-change").addEventListener("click", ()=>tyFile.click());

/* 设置试穿商品并叠加 */
function tySetProduct(p){
  if(!tyPhoto.src){ toast("请先上传一张全身照～"); return; }
  tyCurrent = p;
  tyOverlay.innerHTML = productMedia(p);
  tyOverlay.style.display = "";
  tyApplyTransform();
  document.querySelectorAll("#ty-picker .ty-card").forEach(c=>{
    c.classList.toggle("on", c.dataset.tid===p.id);
  });
}

function tyApplyTransform(){
  const r = tyStage.getBoundingClientRect();
  tyOverlay.style.width = (r.width * tyPos.scale) + "px";
  tyOverlay.style.left  = (tyPos.x * 100) + "%";
  tyOverlay.style.top   = (tyPos.y * 100) + "%";
}

document.getElementById("ty-scale").addEventListener("input", e=>{
  tyPos.scale = (+e.target.value)/100; tyApplyTransform();
});
document.getElementById("ty-reset").addEventListener("click", ()=>{
  tyPos = { x:0.5, y:0.52, scale:(+document.getElementById("ty-scale").value)/100 };
  tyApplyTransform();
});

/* 拖动定位 */
(function tyDrag(){
  let dragging=false;
  tyOverlay.addEventListener("pointerdown", e=>{
    if(tyOverlay.style.display==="none") return;
    dragging=true; tyOverlay.setPointerCapture(e.pointerId); e.preventDefault();
  });
  tyOverlay.addEventListener("pointermove", e=>{
    if(!dragging) return;
    const r = tyStage.getBoundingClientRect();
    tyPos.x = Math.min(1, Math.max(0, (e.clientX - r.left)/r.width));
    tyPos.y = Math.min(1, Math.max(0, (e.clientY - r.top)/r.height));
    tyApplyTransform();
  });
  tyOverlay.addEventListener("pointerup", ()=>{ dragging=false; });
  tyOverlay.addEventListener("pointercancel", ()=>{ dragging=false; });
})();

/* 保存合成图（本地渲染，失败则友好提示） */
document.getElementById("ty-save").addEventListener("click", async ()=>{
  if(!tyPhoto.src || !tyCurrent){ toast("请先上传照片并选择单品"); return; }
  try{
    const sr = tyStage.getBoundingClientRect();
    const cw = 900, ch = Math.round(cw * sr.height / sr.width);
    const canvas = document.createElement("canvas");
    canvas.width = cw; canvas.height = ch;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#f5f5f5"; ctx.fillRect(0,0,cw,ch);
    await drawContain(ctx, tyPhoto, cw, ch);
    const ov = tyOverlay.getBoundingClientRect();
    const ox = (ov.left - sr.left)/sr.width  * cw;
    const oy = (ov.top  - sr.top )/sr.height * ch;
    const ow = ov.width /sr.width  * cw;
    const oh = ov.height/sr.height * ch;
    const img = await overlayToImage(ow, oh);
    ctx.drawImage(img, ox, oy, ow, oh);
    const a = document.createElement("a");
    a.href = canvas.toDataURL("image/png");
    a.download = "hype-tryon.png"; a.click();
    toast("已保存试穿合成图～");
  }catch(err){
    console.warn(err);
    toast("该图暂不支持导出，可直接截图保存试穿效果～");
  }
});

function drawContain(ctx, imgEl, cw, ch){
  return new Promise((resolve)=>{
    const iw = imgEl.naturalWidth || cw, ih = imgEl.naturalHeight || ch;
    const s = Math.min(cw/iw, ch/ih);
    const w = iw*s, h = ih*s, x = (cw-w)/2, y = (ch-h)/2;
    ctx.drawImage(imgEl, x, y, w, h); resolve();
  });
}

function overlayToImage(w, h){
  return new Promise((resolve, reject)=>{
    const node = tyOverlay.firstElementChild;
    if(!node) return reject(new Error("no overlay"));
    if(node.tagName.toLowerCase()==="img"){
      const im = new Image(); im.crossOrigin = "anonymous";
      im.onload = ()=>resolve(im);
      im.onerror = reject;
      im.src = node.src;
    }else{ // SVG
      const clone = node.cloneNode(true);
      clone.setAttribute("width", Math.round(w));
      clone.setAttribute("height", Math.round(h));
      const svgStr = new XMLSerializer().serializeToString(clone);
      const im = new Image();
      im.onload = ()=>resolve(im);
      im.onerror = reject;
      im.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svgStr);
    }
  });
}

/* 生成式 AI 试穿（预留接口） */
document.getElementById("ty-ai-gen").addEventListener("click", async ()=>{
  if(!tyPhoto.src){ toast("请先上传全身照"); return; }
  if(!tyCurrent){ toast("请先选择要试穿的单品"); return; }
  if(!AI_TRYON_ENDPOINT){
    toast("生成式 AI 试穿即将上线，敬请期待～目前可用合成试穿预览效果");
    return;
  }
  const btn = document.getElementById("ty-ai-gen");
  const label = btn.textContent; btn.disabled = true; btn.textContent = "AI 生成中…";
  try{
    const res = await fetch(AI_TRYON_ENDPOINT, {
      method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ photo:tyPhoto.src,
        product:{ id:tyCurrent.id, name:tyCurrent.name, cat:tyCurrent.cat, image:tyCurrent.image_url||"" } })
    });
    const data = await res.json();
    if(data && data.image){
      tyPhoto.src = data.image;
      tyOverlay.style.display = "none";
      toast("AI 试穿完成！");
    }else{
      throw new Error((data && data.error) || "生成失败");
    }
  }catch(err){
    toast("AI 试穿失败：" + err.message);
  }finally{
    btn.disabled = false; btn.textContent = label;
  }
});

/* ---------- AI 穿搭推荐（牛仔裤 + 鞋帽） ---------- */
const TY_SCENES = ["通勤优雅利落","周末街头休闲","约会甜酷平衡","出街个性吸睛","度假慵懒随性"];
function reasonText(c){
  const scene = TY_SCENES[Math.floor(Math.random()*TY_SCENES.length)];
  const tail = (c.s.opts && c.s.opts.kind==="hat") ? "帽饰点睛，整体更有层次" : "潮鞋收尾，比例更修长";
  return `${scene}。「${c.j.name} + ${c.s.name}」协调度约 ${c.score} 分，${tail}。`;
}
function recommendOutfits(){
  const jeans = PRODUCTS.filter(p=>p.cat==="clothing" && p.opts && p.opts.kind==="jeans");
  const foot  = PRODUCTS.filter(p=>p.cat==="footwear");
  const base  = jeans.length ? jeans : PRODUCTS.filter(p=>p.cat==="clothing");
  if(!base.length || !foot.length) return [];
  const combos=[];
  base.forEach(j=>foot.forEach(s=>{
    combos.push({ j, s, tag:(s.opts&&s.opts.kind==="hat")?"帽饰点睛":"潮鞋搭配",
      score:78 + Math.floor(Math.random()*18) + (j.tag?2:0) + (s.tag?2:0) });
  }));
  combos.sort((a,b)=>b.score-a.score);
  const seen=new Set(), out=[];
  for(const c of combos){ if(seen.has(c.j.id)) continue; seen.add(c.j.id); out.push(c); if(out.length>=3) break; }
  return out;
}
function renderOutfits(){
  const box = document.getElementById("ty-outfits");
  const list = recommendOutfits();
  if(!list.length){ box.innerHTML = `<div class="ty-empty2">商品不足，无法生成穿搭建议。</div>`; return; }
  box.innerHTML = list.map((c,i)=>`
    <div class="ty-outfit">
      <div class="ty-of-imgs">
        <div class="ty-of-thumb">${productMedia(c.j)}</div>
        <span class="ty-plus">+</span>
        <div class="ty-of-thumb">${productMedia(c.s)}</div>
      </div>
      <div class="ty-of-info">
        <div class="ty-of-title">推荐搭配 ${i+1} <span class="ty-badge">${c.tag}</span></div>
        <div class="ty-of-names">${escapeHtml(c.j.name)} + ${escapeHtml(c.s.name)}</div>
        <div class="ty-of-reason">${escapeHtml(reasonText(c))}</div>
        <button class="btn sm outline" data-tryj="${c.j.id}">试穿这条牛仔裤</button>
      </div>
    </div>`).join("");
  box.querySelectorAll("[data-tryj]").forEach(b=>b.addEventListener("click",()=>{
    const p = PRODUCTS.find(x=>x.id===b.dataset.tryj); if(p) tySetProduct(p);
  }));
}
document.getElementById("ty-recommend").addEventListener("click", renderOutfits);

paintSwatches(); render();
