<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的订单 · HYPE KIT</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="css/style.css?v=20260902">
</head>
<body>
<div id="nav-slot"></div>

<section class="section">
  <div class="container">
    <h2>我的订单</h2>
    <div class="sub">登录后订单存于账号，换设备登录同一账号即可查看；未登录的订单仅存本设备。</div>
    <div id="orders-body"><div class="empty"><p>加载中…</p></div></div>
  </div>
</section>

<!-- 商品评价弹窗 -->
<div class="modal-mask" id="rv-mask">
  <form class="modal-box" id="rv-form">
    <h3>评价商品</h3>
    <div class="rv-item-line" id="rv-item"></div>
    <div class="mfield">
      <label>评分</label>
      <div class="rv-stars-input" id="rv-stars">
        <span class="s" data-v="1">★</span><span class="s" data-v="2">★</span><span class="s" data-v="3">★</span><span class="s" data-v="4">★</span><span class="s" data-v="5">★</span>
      </div>
    </div>
    <div class="mfield"><label>评价内容</label><textarea id="rv-content" maxlength="300" placeholder="说说这件商品的穿着感受、尺码、质量吧～"></textarea></div>
    <div class="mfield"><label>昵称（选填）</label><input id="rv-author" maxlength="20" placeholder="匿名买家"></div>
    <div class="modal-actions">
      <button type="button" class="btn" style="border:1px solid #e5e5e5" id="rv-cancel">取消</button>
      <button type="submit" class="btn dark" id="rv-submit">提交评价</button>
    </div>
    <div class="co-err" id="rv-err"></div>
  </form>
</div>

<div id="footer-slot"></div>

<!-- 扫码支付弹窗 -->
<div class="modal-mask" id="qr-mask">
  <div class="modal-box qr-box">
    <h3>扫码支付</h3>
    <div id="qr-body"></div>
    <div class="modal-actions">
      <button type="button" class="btn" style="border:1px solid #e5e5e5" id="qr-close">关闭</button>
      <button type="button" class="btn dark" id="qr-done">我已完成支付</button>
    </div>
  </div>
</div>

<script src="js/vendor/supabase.js"></script>
<script src="js/config.js?v=20260902"></script>
<script src="js/data.js?v=20260902"></script>
<script src="js/shared.js?v=20260902"></script>
<script src="js/chat.js?v=20260902"></script>
<script src="js/widget.js?v=20260902"></script>
<script>
(async function(){
await loadContent();
await loadUserData();
mountChrome("orders");

const root = document.getElementById("orders-body");
const newNo = new URLSearchParams(location.search).get("new");
const reviewedKeys = new Set();   // `${token}::${sku}` 已评价
let allOrders = [];
const reviewable = (st)=> st!=="pending_payment" && st!=="cancelled";

function stepIndex(status){ return ORDER_FLOW.indexOf(status); } // -1 表示已取消

function timeline(status){
  const steps = [["下单","pending_payment"],["付款","paid"],["发货","shipped"],["完成","completed"]];
  const cur = stepIndex(status);
  if(status==="cancelled"){
    return `<div class="tl cancelled">订单已取消</div>`;
  }
  return `<div class="tl">${steps.map((s,i)=>{
    const done = i<=cur;
    return `<div class="tl-step ${done?"on":""}">
      <span class="dot"></span><span class="lb">${s[0]}</span>
      ${i<steps.length-1?`<span class="bar ${i<cur?"on":""}"></span>`:""}
    </div>`;
  }).join("")}</div>`;
}

function actions(o){
  const btns = [];
  if(o.status==="pending_payment"){
    btns.push(`<button class="btn dark sm" data-act="pay" data-t="${o.token}">模拟支付</button>`);
    btns.push(`<button class="btn sm scan" data-act="qr" data-t="${o.token}">扫码支付</button>`);
    btns.push(`<button class="btn sm outline" data-act="cancel" data-t="${o.token}">取消订单</button>`);
  }else if(o.status==="paid"){
    btns.push(`<span class="wait">已付款，等待商家发货</span>`);
    btns.push(`<button class="btn sm outline" data-act="cancel" data-t="${o.token}">取消订单</button>`);
  }else if(o.status==="shipped"){
    btns.push(`<button class="btn dark sm" data-act="confirm" data-t="${o.token}">确认收货</button>`);
  }
  return `<div class="ord-actions">${btns.join("")}</div>`;
}

function orderCard(o){
  const canReview = reviewable(o.status);
  const items = (o.items||[]).map((it,idx)=>{
    let rvBtn = "";
    if(canReview && it.sku){
      const done = reviewedKeys.has(o.token + "::" + it.sku);
      rvBtn = done
        ? `<button class="btn review done" disabled>已评价</button>`
        : `<button class="btn review" data-rv="${idx}" data-t="${o.token}">评价</button>`;
    }
    return `
    <div class="ord-item">
      <div class="oi-thumb">${it.svg||""}</div>
      <div class="oi-info"><h4>${escapeHtml(it.title||"")}</h4>
        <div class="m">${escapeHtml(it.meta||"")} ${it.size?("· 尺码 "+escapeHtml(it.size)):""}</div></div>
      <div class="oi-right">¥${it.price} × ${it.qty}${rvBtn?`<div style="margin-top:8px">${rvBtn}</div>`:""}</div>
    </div>`;
  }).join("");
  const ship = o.ship_fee ? ("¥"+o.ship_fee) : "免运费";
  const track = o.status==="shipped"||o.status==="completed"
    ? `<div class="ord-track">物流单号：<b>${escapeHtml(o.tracking_no||"—")}</b></div>` : "";
  const isNew = newNo && o.order_no===newNo;
  return `<div class="ord-card ${isNew?"is-new":""}">
    <div class="ord-head">
      <div>订单号 <b>${escapeHtml(o.order_no)}</b><span class="ord-time">${new Date(o.created_at).toLocaleString()}</span></div>
      <span class="status-badge s-${o.status}">${ORDER_LABEL[o.status]||o.status}</span>
    </div>
    ${timeline(o.status)}
    <div class="ord-items">${items}</div>
    ${track}
    <div class="ord-foot">
      <div class="ord-addr">收货：${escapeHtml(o.customer_name)} ${escapeHtml(o.phone)}<br><span>${escapeHtml(o.address)}</span></div>
      <div class="ord-total">合计 <b>¥${o.total + o.ship_fee}</b><span>（含运费 ${ship}）</span></div>
    </div>
    ${actions(o)}
  </div>`;
}

async function load(){
  const tokens = MyOrders.tokens();
  const uid = window.currentUserId && window.currentUserId();

  // 汇总：账号订单（跨设备） + 本设备 token 订单，按 id 去重
  const map = {};
  if(uid){
    try{
      const { data } = await sb.rpc("get_user_orders");
      (data||[]).forEach(o=> map[o.id] = o);
    }catch(e){}
  }
  if(tokens.length){
    try{
      const { data } = await sb.rpc("get_my_orders", { p_tokens: tokens });
      (data||[]).forEach(o=> map[o.id] = o);
    }catch(e){}
  }

  const list = Object.values(map).sort((a,b)=> new Date(b.created_at) - new Date(a.created_at));
  allOrders = list;
  if(!list.length){
    root.innerHTML = `<div class="empty"><h3>还没有订单</h3><p style="margin-bottom:22px">先去挑一条心仪的牛仔裤吧。</p>
      <a class="btn dark" href="clothing.html">去逛逛</a></div>`;
    return;
  }

  // 载入这些订单已提交过的评价，标记「已评价」
  reviewedKeys.clear();
  try{
    const otokens = list.map(o=>o.token).filter(Boolean);
    if(otokens.length){
      const { data } = await sb.from("reviews").select("order_token,product_id").in("order_token", otokens);
      (data||[]).forEach(r=> reviewedKeys.add(r.order_token + "::" + r.product_id));
    }
  }catch(e){}

  root.innerHTML = list.map(orderCard).join("");

  root.querySelectorAll("[data-act]").forEach(b=>b.addEventListener("click", async ()=>{
    const act = b.dataset.act;
    if(act==="qr"){ openQR(b.dataset.t); return; }
    if(act==="cancel" && !confirm("确定取消该订单？")) return;
    b.disabled = true;
    const { error } = await sb.rpc("guest_order_action", { p_token:b.dataset.t, p_action:act });
    if(error){ toast("操作失败：" + error.message); b.disabled=false; return; }
    toast(act==="pay"?"支付成功":act==="confirm"?"已确认收货":"订单已取消");
    load();
  }));

  root.querySelectorAll("[data-rv]").forEach(b=>b.addEventListener("click", ()=>{
    const o = allOrders.find(x=>x.token===b.dataset.t); if(!o) return;
    const it = (o.items||[])[+b.dataset.rv]; if(!it) return;
    openReview(o.token, it);
  }));
}

/* ---------- 商品评价 ---------- */
let rvCtx = null;   // { token, item }
let rvRating = 5;
function setRvStars(n){
  rvRating = Math.max(1, Math.min(5, n));
  document.querySelectorAll("#rv-stars .s").forEach(s=> s.classList.toggle("on", +s.dataset.v <= rvRating));
}
document.querySelectorAll("#rv-stars .s").forEach(s=> s.addEventListener("click", ()=> setRvStars(+s.dataset.v)));

function openReview(token, item){
  rvCtx = { token, item };
  setRvStars(5);
  document.getElementById("rv-content").value = "";
  document.getElementById("rv-author").value = "";
  document.getElementById("rv-err").textContent = "";
  document.getElementById("rv-item").innerHTML =
    `<div class="rv-item-thumb">${item.svg||""}</div><div><h4>${escapeHtml(item.title||"")}</h4>
     <div class="m" style="color:#888;font-size:13px">${item.size?("尺码 "+escapeHtml(item.size)):""}</div></div>`;
  document.getElementById("rv-mask").classList.add("show");
}
document.getElementById("rv-cancel").addEventListener("click", ()=> document.getElementById("rv-mask").classList.remove("show"));
document.getElementById("rv-mask").addEventListener("click", e=>{ if(e.target.id==="rv-mask") document.getElementById("rv-mask").classList.remove("show"); });
document.getElementById("rv-form").addEventListener("submit", async (e)=>{
  e.preventDefault();
  if(!rvCtx) return;
  const content = document.getElementById("rv-content").value.trim();
  if(!content){ document.getElementById("rv-err").textContent = "请填写评价内容～"; return; }
  const btn = document.getElementById("rv-submit"); btn.disabled = true; btn.textContent = "提交中…";
  try{
    const { error } = await sb.rpc("add_review", {
      p_token: rvCtx.token,
      p_product_id: rvCtx.item.sku,
      p_rating: rvRating,
      p_content: content,
      p_author: document.getElementById("rv-author").value.trim()
    });
    if(error) throw error;
    reviewedKeys.add(rvCtx.token + "::" + rvCtx.item.sku);
    document.getElementById("rv-mask").classList.remove("show");
    toast("评价成功，感谢您的分享！");
    load();
  }catch(err){
    document.getElementById("rv-err").textContent = "提交失败：" + (err.message || err);
  }finally{
    btn.disabled = false; btn.textContent = "提交评价";
  }
});

/* ---------- 扫码支付 ---------- */
function openQR(token){
  const url = (window.SITE && window.SITE.pay_qr_url) || "";
  const note = (window.SITE && window.SITE.pay_note) || "请扫码支付，支付完成后点击「我已完成支付」。";
  const body = document.getElementById("qr-body");
  if(url){
    body.innerHTML = `<img class="qr-img" src="${escapeHtml(url)}" alt="收款码"><p class="qr-note">${escapeHtml(note)}</p>`;
  }else{
    body.innerHTML = `<div class="qr-none">商家尚未上传收款码，请稍后再试或使用「模拟支付」。</div>`;
  }
  const done = document.getElementById("qr-done");
  done.style.display = url ? "" : "none";
  done.onclick = async ()=>{
    done.disabled = true;
    const { error } = await sb.rpc("guest_order_action", { p_token:token, p_action:"pay" });
    done.disabled = false;
    if(error){ toast("操作失败：" + error.message); return; }
    document.getElementById("qr-mask").classList.remove("show");
    toast("支付成功");
    load();
  };
  document.getElementById("qr-mask").classList.add("show");
}
document.getElementById("qr-close").addEventListener("click", ()=> document.getElementById("qr-mask").classList.remove("show"));
document.getElementById("qr-mask").addEventListener("click", e=>{ if(e.target.id==="qr-mask") document.getElementById("qr-mask").classList.remove("show"); });

load();
})();
</script>
</body>
</html>
