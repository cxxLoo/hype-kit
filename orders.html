<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的订单 · HYPE KIT</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="css/style.css?v=20260901">
</head>
<body>
<div id="nav-slot"></div>

<section class="section">
  <div class="container">
    <h2>我的订单</h2>
    <div class="sub">登录后订单存于账号，换设备登录同一账号即可查看；未登录的订单仅存本设备。</div>
    <div id="orders-body"><div class="empty"><p>加载中…</p></div></div>
  </div>
</section>

<div id="footer-slot"></div>

<!-- 扫码支付弹窗 -->
<div class="modal-mask" id="qr-mask">
  <div class="modal-box qr-box">
    <h3>扫码支付</h3>
    <div id="qr-body"></div>
    <div class="modal-actions">
      <button type="button" class="btn" style="border:1px solid #e5e5e5" id="qr-close">关闭</button>
      <button type="button" class="btn dark" id="qr-done">我已完成支付</button>
    </div>
  </div>
</div>

<script src="js/vendor/supabase.js"></script>
<script src="js/config.js?v=20260901"></script>
<script src="js/data.js?v=20260901"></script>
<script src="js/shared.js?v=20260901"></script>
<script>
(async function(){
await loadContent();
await loadUserData();
mountChrome("orders");

const root = document.getElementById("orders-body");
const newNo = new URLSearchParams(location.search).get("new");

function stepIndex(status){ return ORDER_FLOW.indexOf(status); } // -1 表示已取消

function timeline(status){
  const steps = [["下单","pending_payment"],["付款","paid"],["发货","shipped"],["完成","completed"]];
  const cur = stepIndex(status);
  if(status==="cancelled"){
    return `<div class="tl cancelled">订单已取消</div>`;
  }
  return `<div class="tl">${steps.map((s,i)=>{
    const done = i<=cur;
    return `<div class="tl-step ${done?"on":""}">
      <span class="dot"></span><span class="lb">${s[0]}</span>
      ${i<steps.length-1?`<span class="bar ${i<cur?"on":""}"></span>`:""}
    </div>`;
  }).join("")}</div>`;
}

function actions(o){
  const btns = [];
  if(o.status==="pending_payment"){
    btns.push(`<button class="btn dark sm" data-act="pay" data-t="${o.token}">模拟支付</button>`);
    btns.push(`<button class="btn sm scan" data-act="qr" data-t="${o.token}">扫码支付</button>`);
    btns.push(`<button class="btn sm outline" data-act="cancel" data-t="${o.token}">取消订单</button>`);
  }else if(o.status==="paid"){
    btns.push(`<span class="wait">已付款，等待商家发货</span>`);
    btns.push(`<button class="btn sm outline" data-act="cancel" data-t="${o.token}">取消订单</button>`);
  }else if(o.status==="shipped"){
    btns.push(`<button class="btn dark sm" data-act="confirm" data-t="${o.token}">确认收货</button>`);
  }
  return `<div class="ord-actions">${btns.join("")}</div>`;
}

function orderCard(o){
  const items = (o.items||[]).map(it=>`
    <div class="ord-item">
      <div class="oi-thumb">${it.svg||""}</div>
      <div class="oi-info"><h4>${escapeHtml(it.title||"")}</h4>
        <div class="m">${escapeHtml(it.meta||"")} ${it.size?("· 尺码 "+escapeHtml(it.size)):""}</div></div>
      <div class="oi-right">¥${it.price} × ${it.qty}</div>
    </div>`).join("");
  const ship = o.ship_fee ? ("¥"+o.ship_fee) : "免运费";
  const track = o.status==="shipped"||o.status==="completed"
    ? `<div class="ord-track">物流单号：<b>${escapeHtml(o.tracking_no||"—")}</b></div>` : "";
  const isNew = newNo && o.order_no===newNo;
  return `<div class="ord-card ${isNew?"is-new":""}">
    <div class="ord-head">
      <div>订单号 <b>${escapeHtml(o.order_no)}</b><span class="ord-time">${new Date(o.created_at).toLocaleString()}</span></div>
      <span class="status-badge s-${o.status}">${ORDER_LABEL[o.status]||o.status}</span>
    </div>
    ${timeline(o.status)}
    <div class="ord-items">${items}</div>
    ${track}
    <div class="ord-foot">
      <div class="ord-addr">收货：${escapeHtml(o.customer_name)} ${escapeHtml(o.phone)}<br><span>${escapeHtml(o.address)}</span></div>
      <div class="ord-total">合计 <b>¥${o.total + o.ship_fee}</b><span>（含运费 ${ship}）</span></div>
    </div>
    ${actions(o)}
  </div>`;
}

async function load(){
  const tokens = MyOrders.tokens();
  const uid = window.currentUserId && window.currentUserId();

  // 汇总：账号订单（跨设备） + 本设备 token 订单，按 id 去重
  const map = {};
  if(uid){
    try{
      const { data } = await sb.rpc("get_user_orders");
      (data||[]).forEach(o=> map[o.id] = o);
    }catch(e){}
  }
  if(tokens.length){
    try{
      const { data } = await sb.rpc("get_my_orders", { p_tokens: tokens });
      (data||[]).forEach(o=> map[o.id] = o);
    }catch(e){}
  }

  const list = Object.values(map).sort((a,b)=> new Date(b.created_at) - new Date(a.created_at));
  if(!list.length){
    root.innerHTML = `<div class="empty"><h3>还没有订单</h3><p style="margin-bottom:22px">先去挑一条心仪的牛仔裤吧。</p>
      <a class="btn dark" href="clothing.html">去逛逛</a></div>`;
    return;
  }
  root.innerHTML = list.map(orderCard).join("");

  root.querySelectorAll("[data-act]").forEach(b=>b.addEventListener("click", async ()=>{
    const act = b.dataset.act;
    if(act==="qr"){ openQR(b.dataset.t); return; }
    if(act==="cancel" && !confirm("确定取消该订单？")) return;
    b.disabled = true;
    const { error } = await sb.rpc("guest_order_action", { p_token:b.dataset.t, p_action:act });
    if(error){ toast("操作失败：" + error.message); b.disabled=false; return; }
    toast(act==="pay"?"支付成功":act==="confirm"?"已确认收货":"订单已取消");
    load();
  }));
}

/* ---------- 扫码支付 ---------- */
function openQR(token){
  const url = (window.SITE && window.SITE.pay_qr_url) || "";
  const note = (window.SITE && window.SITE.pay_note) || "请扫码支付，支付完成后点击「我已完成支付」。";
  const body = document.getElementById("qr-body");
  if(url){
    body.innerHTML = `<img class="qr-img" src="${escapeHtml(url)}" alt="收款码"><p class="qr-note">${escapeHtml(note)}</p>`;
  }else{
    body.innerHTML = `<div class="qr-none">商家尚未上传收款码，请稍后再试或使用「模拟支付」。</div>`;
  }
  const done = document.getElementById("qr-done");
  done.style.display = url ? "" : "none";
  done.onclick = async ()=>{
    done.disabled = true;
    const { error } = await sb.rpc("guest_order_action", { p_token:token, p_action:"pay" });
    done.disabled = false;
    if(error){ toast("操作失败：" + error.message); return; }
    document.getElementById("qr-mask").classList.remove("show");
    toast("支付成功");
    load();
  };
  document.getElementById("qr-mask").classList.add("show");
}
document.getElementById("qr-close").addEventListener("click", ()=> document.getElementById("qr-mask").classList.remove("show"));
document.getElementById("qr-mask").addEventListener("click", e=>{ if(e.target.id==="qr-mask") document.getElementById("qr-mask").classList.remove("show"); });

load();
})();
</script>
</body>
</html>
